
name: PipelineGuard V2 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate Python engine
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest engine/tests/ -q
          test -f engine/pr_cli.py
          test -f engine/generate_pr_manifest.py
          test -f semgrep-rules/python-security.yml
          test -f .gitleaks.toml

      - name: Identify comparison revisions
        id: rev
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            BASE_SHA="$EVENT_BASE"
            HEAD_SHA="$EVENT_HEAD"
          else
            BASE_SHA="$(git rev-parse origin/main)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          BASELINE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"

          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

          echo "baseline_sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          echo "Baseline: $BASELINE_SHA"
          echo "Head: $HEAD_SHA"

      - name: Prepare worktrees
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.rev.outputs.baseline_sha }}
          HEAD_SHA: ${{ steps.rev.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p reports

          git worktree add --detach baseline "$BASELINE_SHA"
          git worktree add --detach current "$HEAD_SHA"

      - name: Install Semgrep and Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install semgrep==1.180.0

          VERSION=8.30.1

          curl -fsSL --retry 3 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"

          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

          semgrep --version
          ./gitleaks version

      - name: Generate Semgrep reports
        shell: bash
        run: |
          set -euo pipefail

          for revision in baseline current; do
            (
              cd "$revision"

              semgrep scan \
                --config "$GITHUB_WORKSPACE/semgrep-rules/python-security.yml" \
                --json \
                --output "$GITHUB_WORKSPACE/reports/${revision}-semgrep.json" \
                demo-app
            )

            python -m json.tool \
              "reports/${revision}-semgrep.json" > /dev/null
          done

      - name: Build baseline image
        run: |
          docker build \
            -t pipelineguard-v2:scan \
            ./baseline/demo-app

      - name: Scan baseline with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: pipelineguard-v2:scan
          format: json
          output: reports/baseline-trivy.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Build current image
        run: |
          docker build \
            -t pipelineguard-v2:scan \
            ./current/demo-app

      - name: Scan current with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: pipelineguard-v2:scan
          format: json
          output: reports/current-trivy.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Generate Gitleaks reports
        id: leaks
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.rev.outputs.baseline_sha }}
          HEAD_SHA: ${{ steps.rev.outputs.head_sha }}
        run: |
          set -euo pipefail

          scan() {
            local label="$1" range="$2" code
            local report="reports/${label}-gitleaks.json"

            set +e

            ./gitleaks git \
              --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
              --log-opts="$range" \
              --redact \
              --exit-code 1 \
              --report-format json \
              --report-path "$report" \
              .

            code=$?
            set -e

            if [[ "$code" -ne 0 && "$code" -ne 1 ]]; then
              echo "Gitleaks failed for $label (exit $code)" >&2
              exit 1
            fi

            if [[ ! -s "$report" ]]; then
              if [[ "$code" -eq 0 ]]; then
                printf '[]\n' > "$report"
              else
                echo "Missing Gitleaks report for $label" >&2
                exit 1
              fi
            fi

            python -m json.tool "$report" > /dev/null

            echo "${label}_exit=$code" >> "$GITHUB_OUTPUT"
          }

          scan baseline "$BASELINE_SHA"
          scan current "$HEAD_SHA"
          scan pr "${BASELINE_SHA}..${HEAD_SHA}"

      - name: Validate scan reports
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          for rev in ('baseline', 'current'):
              p = Path(f'reports/{rev}-trivy.json')
              d = json.loads(p.read_text(encoding='utf-8'))

              if not isinstance(d, dict) or not isinstance(d.get('Results'), list):
                  raise SystemExit(f'Invalid or incomplete Trivy report: {p}')

          for name in ('baseline', 'current'):
              p = Path(f'reports/{name}-semgrep.json')
              d = json.loads(p.read_text(encoding='utf-8'))

              if not isinstance(d, dict) or not isinstance(d.get('results'), list):
                  raise SystemExit(f'Invalid Semgrep report: {p}')

          for name in ('baseline', 'current', 'pr'):
              p = Path(f'reports/{name}-gitleaks.json')

              if not isinstance(json.loads(p.read_text(encoding='utf-8')), list):
                  raise SystemExit(f'Invalid Gitleaks report: {p}')
          PY

      - name: Generate SHA-256 manifest
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.rev.outputs.baseline_sha }}
          HEAD_SHA: ${{ steps.rev.outputs.head_sha }}
        run: |
          set -euo pipefail

          python -m engine.generate_pr_manifest \
            --baseline-sha "$BASELINE_SHA" \
            --head-sha "$HEAD_SHA" \
            --reports-dir reports \
            --output reports/pr-manifest.json

      - name: Run V2 security gate
        shell: bash
        env:
          BASELINE_SHA: ${{ steps.rev.outputs.baseline_sha }}
          HEAD_SHA: ${{ steps.rev.outputs.head_sha }}
          BASELINE_GITLEAKS_EXIT: ${{ steps.leaks.outputs.baseline_exit }}
          CURRENT_GITLEAKS_EXIT: ${{ steps.leaks.outputs.current_exit }}
          PR_GITLEAKS_EXIT: ${{ steps.leaks.outputs.pr_exit }}
        run: |
          set -euo pipefail

          python -m engine.pr_cli \
            --manifest reports/pr-manifest.json \
            --baseline-sha "$BASELINE_SHA" \
            --head-sha "$HEAD_SHA" \
            --repo-path . \
            --baseline-gitleaks-exit-code "$BASELINE_GITLEAKS_EXIT" \
            --current-gitleaks-exit-code "$CURRENT_GITLEAKS_EXIT" \
            --pr-gitleaks-exit-code "$PR_GITLEAKS_EXIT"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipelineguard-v2-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7
