
name: PipelineGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Identify comparison revisions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Baseline (main): $BASE_SHA"
          echo "Current (PR): $HEAD_SHA"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r demo-app/requirements-dev.txt

      - name: Verify application
        working-directory: demo-app
        run: python -c "from app import app; print(app.title)"

      - name: Run automated tests
        working-directory: demo-app
        run: python -m pytest -v
      - name: Run PipelineGuard Engine tests
        run: python -m pytest engine/tests/ -v

      - name: Build Docker image
        run: docker build -t pipelineguard-demo ./demo-app

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'pipelineguard-demo'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      - name: Verify Trivy report
        run: |
          if [ ! -s trivy-report.json ]; then
            echo "Trivy report is missing or empty."
            exit 1
          fi

          python -m json.tool trivy-report.json > /dev/null


      - name: Scan repository for secrets
        id: gitleaks_scan
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          tar -xzf gitleaks.tar.gz gitleaks

          set +e
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 --report-format json --report-path gitleaks-report.json
          GITLEAKS_EXIT_CODE=$?
          set -e

          echo "Gitleaks exit code: $GITLEAKS_EXIT_CODE"
          echo "exit_code=$GITLEAKS_EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$GITLEAKS_EXIT_CODE" -ne 0 ] && [ "$GITLEAKS_EXIT_CODE" -ne 1 ]; then
            echo "Gitleaks encountered an execution error."
            exit "$GITLEAKS_EXIT_CODE"
          fi

          if [ ! -f gitleaks-report.json ]; then
            echo "Gitleaks report is missing."
            exit 1
          fi
      - name: Scan PR commits with Gitleaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          ./gitleaks git \
            --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-pr-report.json

          GITLEAKS_PR_EXIT_CODE=$?
          set -e

          echo "PR Gitleaks exit code: $GITLEAKS_PR_EXIT_CODE"

          if [ "$GITLEAKS_PR_EXIT_CODE" -ne 0 ] && [ "$GITLEAKS_PR_EXIT_CODE" -ne 1 ]; then
            echo "PR Gitleaks scan failed."
            exit 1
          fi

          if [ ! -s gitleaks-pr-report.json ]; then
            echo "PR Gitleaks report is missing or empty."
            exit 1
          fi

          python -m json.tool gitleaks-pr-report.json > /dev/null
      - name: Scan main baseline with Gitleaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          ./gitleaks git \
            --config .gitleaks.toml \
            --log-opts="$BASE_SHA" \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-baseline-report.json

          GITLEAKS_BASE_EXIT_CODE=$?
          set -e

          echo "Baseline Gitleaks exit code: $GITLEAKS_BASE_EXIT_CODE"

          if [ "$GITLEAKS_BASE_EXIT_CODE" -ne 0 ] && [ "$GITLEAKS_BASE_EXIT_CODE" -ne 1 ]; then
            echo "Baseline Gitleaks scan failed."
            exit 1
          fi

          if [ ! -s gitleaks-baseline-report.json ]; then
            echo "Baseline Gitleaks report is missing or empty."
            exit 1
          fi

          python -m json.tool gitleaks-baseline-report.json > /dev/null

      - name: Semgrep SAST scan
        run: |
          python -m pip install semgrep==1.180.0

          semgrep scan \
            --config semgrep-rules/python-security.yml \
            --json \
            --output semgrep-report.json \
            demo-app

          if [ ! -s semgrep-report.json ]; then
            echo "Semgrep report is missing or empty."
            exit 1
          fi

      - name: PipelineGuard Security Gate
        env:
          GITLEAKS_EXIT_CODE: ${{ steps.gitleaks_scan.outputs.exit_code }}
        run: |
          python -m engine.cli \
            --trivy trivy-report.json \
            --semgrep semgrep-report.json \
            --gitleaks gitleaks-report.json \
            --gitleaks-exit-code "$GITLEAKS_EXIT_CODE"