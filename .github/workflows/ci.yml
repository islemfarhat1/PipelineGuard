
name: PipelineGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r demo-app/requirements-dev.txt

      - name: Verify application
        working-directory: demo-app
        run: python -c "from app import app; print(app.title)"

      - name: Run automated tests
        working-directory: demo-app
        run: python -m pytest -v

      - name: Run PipelineGuard Engine tests
        run: python -m pytest engine/tests/ -v

      - name: Build Docker image
        run: docker build -t pipelineguard-demo ./demo-app

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'pipelineguard-demo'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Verify Trivy report
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s trivy-report.json ]; then
            echo "Trivy report is missing or empty."
            exit 1
          fi

          python -m json.tool trivy-report.json > /dev/null

      - name: Determine Git history scan range
        id: git_range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin \
              "$PR_BASE_SHA" "$PR_HEAD_SHA"

            BASELINE_SHA="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            HEAD_SHA="$PR_HEAD_SHA"

          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASELINE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_AFTER_SHA"

            if [[ "$BASELINE_SHA" =~ ^0+$ ]]; then
              echo "::error::No valid previous commit for push."
              exit 1
            fi

            git cat-file -e "${BASELINE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"

          else
            echo "::error::Unsupported event: $EVENT_NAME"
            exit 1
          fi

          git cat-file -e "${BASELINE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          if ! git merge-base --is-ancestor \
            "$BASELINE_SHA" "$HEAD_SHA"; then
            echo "::error::Invalid Git comparison range."
            exit 1
          fi

          if [[ "$BASELINE_SHA" == "$HEAD_SHA" ]]; then
            echo "::error::Empty Git scan range."
            exit 1
          fi

          echo "range=${BASELINE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"

          echo "Scanning commits introduced in:"
          echo "${BASELINE_SHA}..${HEAD_SHA}"

      - name: Scan repository for secrets
        id: gitleaks_scan
        shell: bash
        env:
          GITLEAKS_VERSION: "8.24.2"
          GIT_SCAN_RANGE: ${{ steps.git_range.outputs.range }}
        run: |
          set -euo pipefail

          if [[ -z "$GIT_SCAN_RANGE" ]]; then
            echo "::error::Git scan range is missing."
            exit 1
          fi

          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          tar -xzf gitleaks.tar.gz gitleaks

          set +e
          ./gitleaks git \
            --config .gitleaks.toml \
            --log-opts="$GIT_SCAN_RANGE" \
            --redact \
            --exit-code 1 \
            --report-format json \
            --report-path gitleaks-report.json
          GITLEAKS_EXIT_CODE=$?
          set -e

          echo "Gitleaks exit code: $GITLEAKS_EXIT_CODE"

          if [[ "$GITLEAKS_EXIT_CODE" -ne 0 ]] && \
             [[ "$GITLEAKS_EXIT_CODE" -ne 1 ]]; then
            echo "::error::Gitleaks execution failed."
            exit 1
          fi

          if [[ ! -f gitleaks-report.json ]]; then
            if [[ "$GITLEAKS_EXIT_CODE" -eq 0 ]]; then
              echo '[]' > gitleaks-report.json
            else
              echo "::error::Gitleaks report missing after detection."
              exit 1
            fi
          fi

          python -m json.tool gitleaks-report.json > /dev/null

          python - <<'PY'
          import json

          with open("gitleaks-report.json", encoding="utf-8") as f:
              findings = json.load(f)

          if not isinstance(findings, list):
              raise SystemExit("Invalid Gitleaks report structure.")

          print(f"Gitleaks findings: {len(findings)}")
          PY

          echo "exit_code=$GITLEAKS_EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Semgrep SAST scan
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install semgrep==1.180.0

          semgrep scan \
            --config semgrep-rules/python-security.yml \
            --json \
            --output semgrep-report.json \
            demo-app

          if [ ! -s semgrep-report.json ]; then
            echo "Semgrep report is missing or empty."
            exit 1
          fi

          python -m json.tool semgrep-report.json > /dev/null

      - name: PipelineGuard Security Gate
        shell: bash
        env:
          GITLEAKS_EXIT_CODE: ${{ steps.gitleaks_scan.outputs.exit_code }}
        run: |
          set -euo pipefail

          python -m engine.cli \
            --trivy trivy-report.json \
            --semgrep semgrep-report.json \
            --gitleaks gitleaks-report.json \
            --gitleaks-exit-code "$GITLEAKS_EXIT_CODE"
